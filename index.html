<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Programa de Aprendiz Daycoval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: editorial portal. Muito branco, tipografia grande, painéis navy cinematográficos como contraponto. Tema único claro, por escolha de marca. */
:root{
  --white:#FFFFFF; --paper:#F4F6F9; --mist:#E8EDF3; --line:#DAE1EA; --line-2:#C5CFDB;
  --ink:#0A1A2B; --ink-2:#34475B; --muted:#66778A;
  --navy:#003865; --navy-2:#002A4D; --navy-3:#00182D; --blue:#2A6AA6; --sky:#DCE8F4; --sky-2:#EEF4FA;
  --gold:#F5C400; --gold-2:#FFD83D; --gold-soft:#FFF5CC; --gold-ink:#6E5500;
  --ok:#1C7A52; --ok-soft:#E0F2E9; --warn:#A86300; --warn-soft:#FCEFD9; --bad:#B23A2E; --bad-soft:#FAE5E2;
  --on-dark:#FFFFFF; --on-dark-2:rgba(255,255,255,.72); --on-dark-3:rgba(255,255,255,.45); --dark-line:rgba(255,255,255,.14);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Hanken Grotesk','Helvetica Neue','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r-s:10px; --r-m:18px; --r-l:28px;
  --sh-1:0 1px 2px rgba(10,26,43,.05),0 8px 24px -14px rgba(10,26,43,.22);
  --sh-2:0 2px 6px rgba(10,26,43,.06),0 24px 48px -24px rgba(0,40,77,.35);
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:650}
p{margin:0}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eyebrow.gold{color:var(--gold)}
.eyebrow.light{color:var(--on-dark-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;gap:.55rem;height:48px;padding:0 1.25rem;border-radius:999px;font-weight:600;font-size:.95rem;transition:transform .25s var(--ease),background .25s,box-shadow .25s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-gold{background:var(--gold);color:var(--navy-3);box-shadow:0 10px 30px -10px rgba(245,196,0,.7)}
.btn-gold:hover{background:var(--gold-2)}
.btn-navy{background:var(--navy);color:var(--white)}
.btn-navy:hover{background:var(--navy-2)}
.btn-ghost-d{border:1px solid rgba(255,255,255,.3);color:var(--white)}
.btn-ghost-d:hover{background:rgba(255,255,255,.08)}
.btn-line{border:1px solid var(--line-2);color:var(--ink);background:var(--white)}
.btn-line:hover{border-color:var(--navy)}
.btn-sm{height:38px;padding:0 1rem;font-size:.87rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;height:28px;padding:0 .7rem;border-radius:999px;background:var(--mist);color:var(--ink-2);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.navy{background:var(--navy);color:#fff}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.line{background:transparent;border:1px solid var(--line-2)}
.chip.dark{background:rgba(255,255,255,.1);color:var(--on-dark-2)}
.chip .ic{width:14px;height:14px}
.link{display:inline-flex;align-items:center;gap:.3rem;font-weight:600;color:var(--navy);font-size:.92rem}
.link .ic{width:16px;height:16px;transition:transform .25s var(--ease)}
.link:hover .ic{transform:translateX(3px)}

/* ---------- photo placeholders ---------- */
.ph{position:relative;overflow:hidden;background:var(--navy);isolation:isolate}
.ph::before{content:"";position:absolute;inset:0;z-index:-1;transition:transform 1.2s var(--ease)}
.ph::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.ph-a::before{background:radial-gradient(120% 90% at 85% 10%,rgba(245,196,0,.55),transparent 45%),radial-gradient(90% 80% at 0% 100%,#2A6AA6,transparent 60%),linear-gradient(160deg,#00305A,#00182D)}
.ph-b::before{background:radial-gradient(80% 70% at 20% 20%,#6FA3D6,transparent 60%),radial-gradient(90% 90% at 100% 100%,#00305A,transparent 70%),linear-gradient(200deg,#1D4F80,#0A2440)}
.ph-c::before{background:radial-gradient(70% 60% at 70% 30%,rgba(255,216,61,.9),transparent 55%),radial-gradient(100% 100% at 0% 100%,#B08A00,transparent 60%),linear-gradient(150deg,#3A2F00,#121A26)}
.ph-d::before{background:radial-gradient(90% 70% at 10% 0%,#8DB7E0,transparent 60%),radial-gradient(80% 80% at 90% 90%,#F5C400,transparent 55%),linear-gradient(170deg,#24598C,#0E2A47)}
.ph-e::before{background:radial-gradient(80% 80% at 80% 80%,#2A6AA6,transparent 60%),radial-gradient(60% 60% at 15% 25%,rgba(255,255,255,.35),transparent 60%),linear-gradient(140deg,#0B2238,#00406F)}
.ph-f::before{background:radial-gradient(100% 70% at 50% 0%,#3D7FBF,transparent 60%),radial-gradient(70% 60% at 100% 100%,rgba(245,196,0,.45),transparent 60%),linear-gradient(180deg,#0A2E52,#06192C)}
.ph-g::before{background:radial-gradient(90% 90% at 0% 0%,#E9C640,transparent 50%),radial-gradient(90% 90% at 100% 60%,#1F5D96,transparent 60%),linear-gradient(160deg,#0B3358,#071A2C)}
.ph-h::before{background:radial-gradient(70% 70% at 70% 20%,#9AC0E4,transparent 55%),radial-gradient(90% 90% at 0% 100%,#003865,transparent 70%),linear-gradient(200deg,#4E7FAE,#123A61)}
.hov:hover .ph::before{transform:scale(1.06)}

/* ---------- demo strip + topbar ---------- */
.demo{background:var(--navy-3);color:var(--on-dark-2);font-size:.78rem}
.demo .wrap{display:flex;align-items:center;gap:1rem;min-height:40px;justify-content:space-between;flex-wrap:wrap;padding-block:4px}
.demo-back{height:28px;padding:0 .8rem;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:.76rem;font-weight:600;transition:background .2s}
.demo-back:hover{background:var(--gold);color:var(--navy-3)}
.demo-tag{display:flex;align-items:center;gap:.5rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;font-size:.66rem}
.demo-tag i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(245,196,0,.18)}
.demo-ctrls{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:999px;padding:3px}
.seg button{height:26px;padding:0 .75rem;border-radius:999px;font-size:.76rem;font-weight:600;color:var(--on-dark-2);transition:background .2s,color .2s}
.seg button.on{background:var(--white);color:var(--navy-3)}
.seg-label{color:var(--on-dark-3);font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1.5rem;height:68px}
.brand{display:flex;align-items:center;gap:.75rem;flex:none}
.logo-slot{font-family:var(--f-display);font-weight:750;font-size:1.32rem;color:var(--navy);letter-spacing:-.03em;line-height:1}
.brand-sep{width:1px;height:26px;background:var(--line-2)}
.brand-prog{font-size:.72rem;line-height:1.15;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;gap:.15rem;flex:1;justify-content:center}
.nav button{height:38px;padding:0 .8rem;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s;white-space:nowrap}
.nav button:hover{background:var(--mist)}
.nav button.on{background:var(--navy);color:#fff}
.me{display:flex;align-items:center;gap:.6rem;flex:none}
.bell{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.bell:hover{background:var(--mist)}
.bell b{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;background:linear-gradient(135deg,var(--blue),var(--navy));flex:none}
.avatar.lg{width:64px;height:64px;font-size:1.2rem}
.tabbar{display:none}
main#view{min-height:70vh;padding-bottom:5rem}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rv{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
.rv.pre{opacity:0;transform:translateY(28px);animation:none}
.rv.post{animation:none;opacity:1;transform:none;transition:opacity .9s var(--ease),transform .9s var(--ease)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,196,0,.55)}100%{box-shadow:0 0 0 14px rgba(245,196,0,0)}}
@keyframes grow{from{width:0}}
@keyframes growh{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv.pre{opacity:1;transform:none}}

/* ---------- LANDING ---------- */
#landing{background:var(--white)}
.hero{position:relative;min-height:100svh;background:var(--navy-3);color:#fff;overflow:hidden;display:flex;flex-direction:column}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-veil{position:absolute;inset:0;background:radial-gradient(70% 80% at 15% 60%,rgba(0,24,45,.82),transparent 70%),linear-gradient(0deg,rgba(0,24,45,.9),transparent 35%)}
.hero > .wrap{width:100%}
.hero-top{position:relative;display:flex;justify-content:space-between;align-items:center;padding-block:1.5rem}
.hero-top .logo-slot{color:#fff;font-size:1.5rem}
.hero-body{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:3rem 2rem}
.hero h1{font-size:clamp(2.9rem,8.4vw,7.6rem);line-height:.92;letter-spacing:-.045em;font-weight:700;max-width:12ch}
.hero h1 .l2{display:block;color:var(--gold);font-weight:300;font-style:normal;margin-top:.12em;letter-spacing:-.04em}
@keyframes wordin{from{opacity:0;transform:translateY(.4em);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.hero h1 .w{display:inline-block;animation:wordin 1s var(--ease) both}
.hero-sub{margin-top:2rem;max-width:44ch;font-size:clamp(1.02rem,1.5vw,1.2rem);color:var(--on-dark-2)}
.hero-cta{margin-top:2.2rem;display:flex;gap:.75rem;flex-wrap:wrap}
.hero-foot{position:relative;border-top:1px solid var(--dark-line);padding-block:1rem;display:flex;gap:2rem;align-items:center}
.marquee{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-in{display:flex;gap:2.8rem;width:max-content;animation:mq 60s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.marquee span{font-family:var(--f-mono);font-size:.74rem;color:var(--on-dark-3);letter-spacing:.06em;white-space:nowrap}
.marquee span b{color:var(--gold);font-weight:500}
.video-slot{overflow:hidden;color:#fff;box-shadow:0 20px 50px -20px rgba(0,0,0,.7);position:absolute;right:clamp(16px,4vw,48px);bottom:5.5rem;width:min(340px,40vw);aspect-ratio:16/9;border-radius:var(--r-m);border:1px solid var(--dark-line);display:flex;align-items:flex-end;padding:1rem;cursor:pointer;transition:transform .4s var(--ease)}
.video-slot:hover{transform:translateY(-3px)}
.video-slot .play{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.video-slot small{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;color:var(--on-dark-2);text-transform:uppercase}

.l-sec{padding-block:clamp(4rem,10vw,8rem)}
.l-quote{font-family:var(--f-display);font-size:clamp(1.9rem,4.4vw,3.6rem);line-height:1.04;letter-spacing:-.035em;font-weight:500;max-width:22ch}
.l-quote em{font-style:normal;color:var(--navy);font-weight:750}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1rem,3vw,3rem);margin-top:clamp(3rem,6vw,5rem);border-top:1px solid var(--line);padding-top:2rem}
.pillar h3{font-size:1.35rem;margin:.6rem 0 .5rem}
.pillar p{color:var(--ink-2);max-width:34ch}
.pillar .plus{font-family:var(--f-display);font-size:2.2rem;color:var(--gold);line-height:1;font-weight:300}
.moments{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-top:3rem;counter-reset:m}
.moment{padding:1.5rem 1.2rem 1.8rem;border-left:1px solid var(--line);position:relative;transition:background .3s}
.moment:hover{background:var(--sky-2)}
.moment .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.moment h3{font-size:clamp(1.3rem,2vw,1.7rem);margin:2.2rem 0 .6rem;letter-spacing:-.03em}
.moment p{font-size:.92rem;color:var(--ink-2)}
.moment::before{content:"";position:absolute;left:-1px;top:0;width:3px;height:0;background:var(--gold);transition:height .5s var(--ease)}
.moment:hover::before{height:100%}
.split{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(2rem,5vw,5rem);align-items:center}
.cities{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-family:var(--f-display);font-size:clamp(1.4rem,3vw,2.4rem);line-height:1.15;letter-spacing:-.03em;color:var(--line-2);font-weight:600}
.cities span{transition:color .3s}
.cities span.hot{color:var(--navy)}
.cities sup{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:0;font-weight:400;margin-left:.15rem}
.shift{background:var(--navy-3);color:#fff;border-radius:var(--r-l);padding:clamp(2rem,6vw,5rem);display:grid;gap:2rem}
.shift .from{font-family:var(--f-display);font-size:clamp(1.3rem,2.8vw,2.2rem);color:var(--on-dark-3);text-decoration:line-through;text-decoration-color:var(--gold);text-decoration-thickness:2px;letter-spacing:-.02em;max-width:30ch}
.shift .to{font-family:var(--f-display);font-size:clamp(1.8rem,4.4vw,3.6rem);line-height:1.02;letter-spacing:-.035em;font-weight:650;max-width:22ch}
.shift .to b{color:var(--gold);font-weight:650}
.l-final{text-align:left;display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap}
.l-final h2{font-size:clamp(2.4rem,6vw,5rem);line-height:.95;letter-spacing:-.045em;max-width:14ch}
.l-foot{border-top:1px solid var(--line);padding-block:2rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.brand-reserve{border:1px dashed var(--line-2);border-radius:12px;padding:.7rem 1rem;display:flex;gap:.8rem;align-items:center}

/* ---------- shared page heads ---------- */
.phead{padding-block:clamp(2.5rem,6vw,4.5rem) clamp(1.5rem,3vw,2.5rem);display:grid;gap:1rem}
.phead h1{font-size:clamp(2.4rem,5.8vw,4.8rem);line-height:.96;letter-spacing:-.045em;font-weight:700;max-width:16ch}
.phead .lede{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--ink-2);max-width:52ch}
.sec{margin-top:clamp(2.5rem,5vw,4rem)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.sec-h h2{font-size:clamp(1.5rem,2.6vw,2.1rem);letter-spacing:-.03em}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m)}
.grid{display:grid;gap:1.25rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- HOME ---------- */
.home-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,4rem);align-items:end;padding-block:clamp(2.5rem,6vw,4.5rem) 2rem}
.home-hero h1{font-size:clamp(3rem,7.6vw,6.4rem);line-height:.92;letter-spacing:-.05em;font-weight:700}
.home-hero h1 .soft{display:block;color:var(--line-2);font-weight:500;font-size:.62em;letter-spacing:-.04em;margin-top:.12em}
.home-hero h1 .soft b{color:var(--navy);font-weight:650}
.whoami{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.5rem}
.month-callout{font-family:var(--f-display);font-size:clamp(1.25rem,2.2vw,1.65rem);letter-spacing:-.025em;line-height:1.2;color:var(--ink);font-weight:500}
.month-callout b{font-weight:700;color:var(--navy);background:linear-gradient(transparent 62%,var(--gold-soft) 62%)}
.daycount{display:flex;align-items:baseline;gap:.6rem;margin-top:1rem}
.daycount strong{font-family:var(--f-display);font-size:3.4rem;line-height:1;letter-spacing:-.05em;color:var(--navy);font-weight:700}

/* track */
.track{background:var(--white);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(1.25rem,3vw,2.25rem);box-shadow:var(--sh-1)}
.track-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:2.6rem}
.track-bar{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:10px;margin-inline:2px}
.tseg{position:relative;border-radius:999px;background:var(--mist);overflow:hidden}
.tseg i{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:999px;animation:grow 1.4s var(--ease) both}
.tseg.cur i{background:linear-gradient(90deg,var(--navy),var(--blue))}
.cp{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;transform:rotate(45deg);background:var(--white);border:2px solid var(--line-2);z-index:2}
.cp.done{background:var(--navy);border-color:var(--navy)}
.cp.next{border-color:var(--gold);background:var(--gold)}
.cp-tip{position:absolute;top:20px;transform:translateX(-50%);font-family:var(--f-mono);font-size:.62rem;color:var(--muted);white-space:nowrap;letter-spacing:.04em}
.you{position:absolute;top:50%;z-index:3;transform:translate(-50%,-50%)}
.you i{display:block;width:22px;height:22px;border-radius:50%;background:var(--gold);border:4px solid var(--white);box-shadow:0 0 0 1px var(--gold);animation:pulse 1.8s infinite}
.you span{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--navy-3);color:#fff;font-size:.72rem;font-weight:600;padding:.3rem .6rem;border-radius:8px;white-space:nowrap}
.you span::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--navy-3)}
.track-labels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:2.6rem}
.you span.edge{left:-6px;transform:none}
.you span.edge::after{left:17px}
.tl{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:.9rem .7rem .9rem 0;cursor:pointer;border-radius:12px;transition:background .25s;text-align:left}
.tl:hover{background:var(--sky-2)}
.tl .n{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.tl h4{font-size:clamp(1rem,1.5vw,1.25rem);margin:.25rem 0 .2rem;letter-spacing:-.025em}
.tl .st{font-size:.76rem;font-weight:600;display:flex;align-items:center;gap:.3rem}
.tl.done .st{color:var(--ok)}
.tl.cur .st{color:var(--gold-ink)}
.tl.next h4,.tl.next .n{color:var(--muted)}
.tl.next .st{color:var(--muted);font-weight:500}
.tl.cur h4{color:var(--navy)}
.tl .goal{display:block;font-size:.8rem;color:var(--muted);margin-top:.3rem;line-height:1.35}

.now{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.25rem;margin-top:1.25rem}
.next-card{position:relative;border-radius:var(--r-l);padding:clamp(1.5rem,3vw,2.4rem);color:#fff;min-height:320px;display:flex;flex-direction:column;justify-content:space-between;gap:1.5rem;overflow:hidden}
.next-card h3{font-size:clamp(1.7rem,3.2vw,2.6rem);line-height:1;letter-spacing:-.04em;max-width:16ch}
.next-card p{color:var(--on-dark-2);max-width:42ch}
.next-meta{display:flex;gap:.5rem;flex-wrap:wrap}
.countdown{position:absolute;right:clamp(1.5rem,3vw,2.4rem);top:clamp(1.5rem,3vw,2.4rem);text-align:right}
.countdown b{display:block;font-family:var(--f-display);font-size:clamp(3rem,6vw,4.6rem);line-height:.9;color:var(--gold);letter-spacing:-.05em;font-weight:700}
.countdown small{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-2)}
.cont{display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.cont .ph{aspect-ratio:16/8;display:flex;align-items:flex-end;padding:1.1rem;color:#fff}
.cont .ph .pbtn{width:46px;height:46px;border-radius:50%;background:var(--white);color:var(--navy);display:grid;place-items:center;margin-left:auto;transition:transform .3s var(--ease)}
.cont:hover .pbtn{transform:scale(1.08)}
.prog{height:4px;background:var(--mist);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy);border-radius:99px;animation:grow 1.2s var(--ease) both}
.prog.gold i{background:var(--gold)}
.prog.dark{background:rgba(255,255,255,.18)}
.prog.dark i{background:var(--gold)}
.cont-b{padding:1.2rem 1.3rem 1.4rem;display:grid;gap:.6rem}
.cont-b h4{font-size:1.2rem;letter-spacing:-.025em;line-height:1.15}
.ctx{display:flex;gap:1rem;align-items:flex-start;background:var(--gold-soft);border-radius:var(--r-m);padding:1rem 1.2rem;margin-top:1.25rem;color:var(--ink)}
.ctx .ic{color:var(--gold-ink);margin-top:2px}
.ctx p{font-size:.95rem}
.ctx button{margin-left:auto;font-weight:700;color:var(--navy);font-size:.88rem;white-space:nowrap}
.wk{display:grid;gap:0}
.wk-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:1rem;align-items:center;padding:1rem 1.2rem;border-top:1px solid var(--line);transition:background .2s;cursor:pointer}
.wk-row:first-child{border-top:0}
.wk-row:hover{background:var(--sky-2)}
.wk-d{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);line-height:1.3;text-transform:uppercase}
.wk-d b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink);letter-spacing:-.03em;font-weight:650}
.wk-t{font-weight:600;line-height:1.25}
.wk-s{font-size:.82rem;color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.15rem}
.stamps-strip{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.voice{border-radius:var(--r-l);padding:clamp(1.5rem,3vw,2.2rem);background:var(--sky);display:grid;gap:1.2rem}
.voice h3{font-size:clamp(1.4rem,2.4vw,2rem);letter-spacing:-.035em;line-height:1.05;max-width:20ch}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{height:40px;padding:0 1rem;border-radius:999px;background:var(--white);border:1px solid transparent;font-weight:600;font-size:.88rem;transition:all .2s}
.opt:hover{border-color:var(--navy)}
.opt.on{background:var(--navy);color:#fff}

/* ---------- JORNADA ---------- */
.jlist{display:grid;gap:0;border-top:1px solid var(--line)}
.jrow{display:grid;grid-template-columns:120px minmax(0,1fr) 220px;gap:clamp(1rem,3vw,2.5rem);padding-block:clamp(1.5rem,3vw,2.4rem);border-bottom:1px solid var(--line);position:relative;cursor:pointer;transition:background .3s}
.jrow:hover{background:linear-gradient(90deg,var(--sky-2),transparent)}
.jnum{font-family:var(--f-display);font-size:clamp(3rem,6vw,5.4rem);line-height:.85;font-weight:300;letter-spacing:-.05em;color:var(--line-2)}
.jrow.done .jnum{color:var(--navy)}
.jrow.cur .jnum{color:var(--gold);font-weight:700}
.jrow h3{font-size:clamp(1.8rem,3.4vw,2.8rem);letter-spacing:-.04em;line-height:1}
.jrow .goal{font-family:var(--f-display);font-size:1.1rem;color:var(--ink-2);margin-top:.5rem;font-weight:400}
.jrow .desc{color:var(--muted);margin-top:.6rem;max-width:58ch;font-size:.95rem}
.jside{display:grid;gap:.6rem;align-content:start;justify-items:start}
.jside .big{font-family:var(--f-display);font-size:1.6rem;font-weight:650;letter-spacing:-.03em}
.jrow.next h3{color:var(--ink-2)}
.jnext{margin-top:1.2rem;display:grid;gap:.5rem}
.jnext div{display:flex;gap:.6rem;align-items:center;font-size:.92rem;font-weight:500}
.jnext .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.jcp{display:flex;gap:.8rem;align-items:center;padding:.8rem 0 .8rem 120px;border-bottom:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.jcp .d{width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--line-2);flex:none}
.jcp.done .d{background:var(--navy);border-color:var(--navy)}
.jcp.next .d{background:var(--gold);border-color:var(--gold)}
.jcp b{color:var(--ink);font-weight:600}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.dual > div{padding:1.6rem;border-radius:var(--r-m)}
.dual h4{font-size:1.25rem;margin:.5rem 0 .4rem}
.dual p{font-size:.92rem;color:var(--ink-2)}

/* ---------- ETAPA ---------- */
.stage-hero{position:relative;color:#fff;border-radius:0 0 var(--r-l) var(--r-l);overflow:hidden}
.stage-hero .wrap{position:relative;padding-block:clamp(2rem,5vw,4rem);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:end}
.stage-num{font-family:var(--f-display);font-size:clamp(7rem,20vw,16rem);line-height:.75;font-weight:700;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.35);position:absolute;right:clamp(16px,4vw,48px);top:1.5rem;pointer-events:none}
.stage-hero h1{font-size:clamp(3rem,8vw,6.6rem);line-height:.9;letter-spacing:-.055em;font-weight:700}
.stage-hero .goal{font-family:var(--f-display);font-size:clamp(1.2rem,2.4vw,1.8rem);color:var(--gold);margin-top:1rem;font-weight:400;letter-spacing:-.02em}
.stage-hero .intro{color:var(--on-dark-2);max-width:56ch;margin-top:1rem}
.back{display:flex;width:max-content;align-items:center;gap:.3rem;font-size:.86rem;font-weight:600;color:var(--on-dark-2);margin-bottom:2rem}
.back:hover{color:#fff}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rt b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1;font-weight:700}
.ring .rt small{font-size:.68rem;color:var(--on-dark-2);font-family:var(--f-mono);letter-spacing:.06em}
.ring circle{transition:stroke-dashoffset 1.2s var(--ease)}
.items{display:grid;gap:.6rem}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:1rem;align-items:center;padding:1rem 1.2rem;background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);transition:border-color .2s,box-shadow .3s,transform .3s var(--ease)}
.item:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
.item.done{background:var(--paper)}
.item.done .it-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.item.lock{opacity:.62}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:all .3s var(--ease)}
.chk:hover{border-color:var(--navy)}
.item.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.item.done .chk .ic{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.item.lock .chk{border-style:dashed;color:var(--muted)}
.item.focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.it-t{font-weight:600;line-height:1.3}
.it-s{font-size:.8rem;color:var(--muted);display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.2rem}
.it-s span{display:inline-flex;align-items:center;gap:.25rem}
.it-s .ic{width:13px;height:13px}
.it-go{color:var(--navy);display:flex;align-items:center;gap:.3rem;font-size:.84rem;font-weight:600}
.stage-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--line);flex-wrap:wrap}
.stage-nav button{display:grid;gap:.2rem;text-align:left;padding:.8rem 0}
.stage-nav button:last-child{text-align:right}
.stage-nav b{font-family:var(--f-display);font-size:1.6rem;letter-spacing:-.03em;font-weight:650}
.aside-note{border-left:3px solid var(--gold);padding:.4rem 0 .4rem 1.2rem;display:grid;gap:.5rem}
.aside-note p{font-family:var(--f-display);font-size:1.3rem;line-height:1.25;letter-spacing:-.02em}

/* ---------- POR DENTRO (dark) ---------- */
.dark-page{background:var(--navy-3);color:#fff}
.dark-page .phead .lede{color:var(--on-dark-2)}
.pd-feature{position:relative;border-radius:var(--r-l);min-height:min(560px,70vh);display:flex;align-items:flex-end;padding:clamp(1.5rem,4vw,3.5rem);overflow:hidden;cursor:pointer}
.pd-feature h2{font-size:clamp(2.2rem,5.6vw,4.8rem);line-height:.95;letter-spacing:-.05em;font-weight:700;max-width:14ch}
.pd-feature .meta{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.2rem 0 1.6rem}
.pd-feature p{color:var(--on-dark-2);max-width:48ch}
.pd-feature .who{position:absolute;right:clamp(1.5rem,4vw,3.5rem);top:clamp(1.5rem,4vw,3.5rem);text-align:right;font-size:.85rem;color:var(--on-dark-2)}
.pd-feature .who b{display:block;color:#fff;font-size:1rem}
.rowx{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:1rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.rowx > *{scroll-snap-align:start}
.area{position:relative;border-radius:var(--r-m);aspect-ratio:3/4;padding:1.3rem;display:flex;flex-direction:column;justify-content:space-between;color:#fff;cursor:pointer;text-align:left;overflow:hidden}
.area .an{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-2)}
.area h3{font-size:1.55rem;letter-spacing:-.035em;line-height:1}
.area q{display:block;font-family:var(--f-display);font-size:1.12rem;line-height:1.18;quotes:"“" "”";font-weight:400;margin-top:.6rem;color:var(--on-dark-2)}
.area .pp{position:absolute;bottom:0;left:0;height:3px;background:var(--gold)}
.area:hover q{color:#fff}
.wide{border-radius:var(--r-m);overflow:hidden;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid var(--dark-line);display:flex;flex-direction:column;transition:border-color .3s}
.wide:hover{border-color:rgba(255,255,255,.35)}
.wide .ph{aspect-ratio:16/9;padding:1rem;display:flex;align-items:flex-start;justify-content:space-between}
.wide .b{padding:1rem 1.1rem 1.2rem;display:grid;gap:.35rem}
.wide h4{font-size:1.1rem;letter-spacing:-.02em;line-height:1.2}
.wide small{color:var(--on-dark-3);font-size:.8rem}
.story{display:grid;grid-template-columns:1fr;border-radius:var(--r-m);overflow:hidden;background:var(--white);color:var(--ink);cursor:pointer}
.story .ph{aspect-ratio:4/3}
.story .b{padding:1.3rem;display:grid;gap:.5rem}
.story blockquote{margin:0;font-family:var(--f-display);font-size:1.35rem;line-height:1.1;letter-spacing:-.03em;font-weight:600}
.story .yr{position:absolute;left:1.1rem;bottom:1rem;font-family:var(--f-display);font-size:3.4rem;line-height:.8;color:#fff;font-weight:700;letter-spacing:-.05em}
.live-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.2rem;align-items:center;padding:1.2rem 0;border-top:1px solid var(--dark-line)}
.live-row .d{font-family:var(--f-display);font-size:2rem;font-weight:650;letter-spacing:-.04em;line-height:1;width:72px}
.live-row .d small{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--on-dark-3);letter-spacing:.1em;margin-top:.3rem}

/* ---------- CONTEÚDO ---------- */
.player{position:relative;aspect-ratio:16/9;border-radius:var(--r-l);overflow:hidden;color:#fff;max-height:72vh;width:100%}
.player .ttl{position:absolute;left:clamp(1.2rem,3vw,2.5rem);bottom:clamp(4.5rem,8vw,5.5rem);right:30%}
.player .ttl h1{font-size:clamp(1.8rem,4.4vw,3.6rem);line-height:.98;letter-spacing:-.045em;font-weight:700}
.player .bigplay{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--gold);color:var(--navy-3);display:grid;place-items:center;transition:transform .3s var(--ease);box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
.player .bigplay:hover{transform:translate(-50%,-50%) scale(1.07)}
.player .bigplay .ic{width:32px;height:32px;margin-left:4px}
.pctrl{position:absolute;left:0;right:0;bottom:0;padding:1rem clamp(1.2rem,3vw,2.5rem);display:flex;gap:1rem;align-items:center;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
.pbar{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.25);position:relative;cursor:pointer}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:9px}
.pbar .mk{position:absolute;top:-2px;width:2px;height:9px;background:rgba(255,255,255,.7)}
.ptime{font-family:var(--f-mono);font-size:.76rem;color:var(--on-dark-2)}
.playing .bigplay{opacity:0;pointer-events:none}
.c-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);margin-top:2rem}
.chapters{display:grid}
.chap{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:.8rem;padding:.9rem 0;border-top:1px solid var(--line);align-items:center;text-align:left;width:100%}
.chap:hover b{color:var(--navy)}
.chap.on b{color:var(--navy)}
.chap .t{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.take{display:grid;gap:1rem;counter-reset:t}
.take div{display:grid;grid-template-columns:40px 1fr;gap:.6rem;align-items:start}
.take div::before{counter-increment:t;content:counter(t,decimal-leading-zero);font-family:var(--f-mono);font-size:.78rem;color:var(--gold-ink);background:var(--gold-soft);border-radius:8px;height:28px;display:grid;place-items:center}
.speaker{display:flex;gap:1rem;align-items:center}
.ask{display:flex;gap:.5rem;margin-top:.8rem}
.ask input{flex:1;min-width:0;height:46px;border-radius:999px;border:1px solid var(--line-2);padding:0 1.1rem;background:var(--white)}
.ask input:focus{outline:none;border-color:var(--navy)}
.done-bar{position:sticky;bottom:1rem;z-index:5;margin-top:2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--navy-3);color:#fff;border-radius:999px;padding:.6rem .6rem .6rem 1.4rem;box-shadow:var(--sh-2);flex-wrap:wrap}

/* ---------- DESENVOLVIMENTO ---------- */
.cps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.cps::before{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:var(--line)}
.cpn{position:relative;padding-right:1rem;display:grid;gap:.35rem;align-content:start}
.cpn .dm{width:32px;height:32px;display:grid;place-items:center;position:relative;z-index:1}
.cpn .dm i{width:18px;height:18px;transform:rotate(45deg);background:var(--white);border:2px solid var(--line-2);display:block}
.cpn.done .dm i{background:var(--navy);border-color:var(--navy)}
.cpn.next .dm i{background:var(--gold);border-color:var(--gold);animation:pulse 1.8s infinite}
.cpn h4{font-size:1.25rem;letter-spacing:-.03em;margin-top:.5rem}
.cpn small{font-size:.8rem;color:var(--muted)}
.cpn .when{font-size:.82rem;font-weight:600}
.cpn.done .when{color:var(--ok)}
.cpn.next .when{color:var(--gold-ink)}
.prep{background:var(--white);border:1px solid var(--gold);border-radius:var(--r-l);padding:clamp(1.3rem,3vw,2rem);margin-top:1.5rem;display:grid;gap:1.2rem;box-shadow:0 0 0 4px var(--gold-soft)}
.prep label{display:grid;gap:.45rem;font-weight:600}
.prep label span{font-weight:400;color:var(--muted);font-size:.88rem}
textarea{width:100%;min-height:84px;border:1px solid var(--line-2);border-radius:14px;padding:.8rem 1rem;resize:vertical;background:var(--paper);line-height:1.45}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--navy);background:var(--white)}
.comp{display:grid;grid-template-columns:200px minmax(0,1fr) 120px;gap:1.2rem;align-items:center;padding:1.1rem 0;border-top:1px solid var(--line)}
.comp h4{font-size:1.05rem;letter-spacing:-.015em;font-family:var(--f-body);font-weight:650}
.comp small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.lv{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:34px;align-items:center}
.lv span{height:8px;border-radius:99px;background:var(--mist)}
.lv span.f{background:var(--sky)}
.lv .mk{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);transition:left 1s var(--ease)}
.lv .mk.me{background:var(--navy);border:3px solid var(--white);box-shadow:0 0 0 1px var(--navy)}
.lv .mk.mg{background:transparent;border:3px solid var(--gold);width:28px;height:28px}
.lv-scale{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-family:var(--f-mono);font-size:.64rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.trend{font-size:.82rem;font-weight:600;color:var(--ok);text-align:right}
.legend{display:flex;gap:1.2rem;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.fb{padding:1.5rem;display:grid;gap:1rem}
.fb blockquote{margin:0;font-family:var(--f-display);font-size:1.2rem;line-height:1.3;letter-spacing:-.015em;font-weight:450}
.fb .from{display:flex;gap:.7rem;align-items:center;font-size:.85rem}
.fb .from .avatar{width:34px;height:34px;font-size:.72rem}
.focus-c{padding:1.4rem;display:grid;gap:.6rem;border-radius:var(--r-m);background:var(--white);border:1px solid var(--line)}
.focus-c .n{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--gold);font-weight:700;letter-spacing:-.04em}
.journal{display:grid;gap:.8rem}
.jentry{padding:1rem 1.2rem;border-radius:var(--r-m);background:var(--white);border:1px solid var(--line)}
.jentry small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em}

/* ---------- AGENDA ---------- */
.ag-top{display:flex;gap:1rem;justify-content:space-between;align-items:center;flex-wrap:wrap}
.lseg{max-width:100%;overflow-x:auto;scrollbar-width:none;display:inline-flex;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px}
.lseg button{flex:none;height:36px;padding:0 1rem;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--ink-2)}
.lseg button.on{background:var(--navy);color:#fff}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem;margin-top:1.5rem}
.day{border-radius:var(--r-m);padding:.9rem .5rem;text-align:center;background:var(--white);border:1px solid var(--line);display:grid;gap:.2rem;justify-items:center}
.day small{font-family:var(--f-mono);font-size:.66rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.day b{font-family:var(--f-display);font-size:1.7rem;line-height:1;letter-spacing:-.04em;font-weight:650}
.day.today{background:var(--navy);color:#fff;border-color:var(--navy)}
.day.today small{color:var(--on-dark-2)}
.day.hol{background:var(--paper)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.day .dots i.g{background:var(--gold)}
.day.today .dots i{background:#fff}
.day.today .dots i.g{background:var(--gold)}
.ev-group h3{font-size:1rem;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2rem 0 .8rem}
.ev{display:grid;grid-template-columns:110px 6px minmax(0,1fr) auto;gap:1.2rem;align-items:center;padding:1.2rem;background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:.6rem}
.ev .tm{font-family:var(--f-display);font-size:1.6rem;font-weight:650;letter-spacing:-.04em;line-height:1}
.ev .tm small{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);letter-spacing:.06em;margin-top:.35rem;font-weight:400}
.ev .bar{width:6px;height:100%;min-height:52px;border-radius:9px;background:var(--blue)}
.ev.ind .bar{background:var(--gold)}
.ev.evcp .bar{background:var(--navy)}
.ev h4{font-size:1.15rem;letter-spacing:-.02em;line-height:1.2;font-family:var(--f-body);font-weight:650}
.ev .m{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.5rem}
.ev > *{min-width:0}
.ev .chip{white-space:normal;height:auto;min-height:28px;padding-block:.25rem}
.ev .why{font-size:.82rem;color:var(--muted);margin-top:.45rem}
.ev-act{display:flex;gap:.5rem}
.conf.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.hol-row{padding:1rem 1.2rem;border-radius:var(--r-m);border:1px dashed var(--line-2);color:var(--muted);font-size:.9rem;margin-bottom:.6rem}

/* ---------- PASSAPORTE ---------- */
.pass{position:relative;border-radius:var(--r-l);background:var(--navy-2);color:#fff;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.pass-cover{padding:clamp(1.6rem,4vw,3rem);display:flex;flex-direction:column;justify-content:space-between;gap:2rem;border-right:1px dashed rgba(255,255,255,.2);background:radial-gradient(80% 60% at 0% 0%,rgba(245,196,0,.12),transparent 60%)}
.pass-cover h1{font-family:var(--f-display);font-size:clamp(2.4rem,5vw,4rem);line-height:.92;letter-spacing:.01em;font-weight:300;text-transform:uppercase;color:var(--gold)}
.pass-cover h1 b{display:block;font-weight:750;color:#fff;letter-spacing:-.02em}
.pass-data{padding:clamp(1.6rem,4vw,3rem);display:grid;grid-template-columns:1fr 1fr;gap:1.2rem 1.5rem;align-content:start;background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(255,255,255,.035) 27px 28px)}
.pass-data dt{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-3)}
.pass-data dd{margin:.25rem 0 0;font-weight:600;font-size:1rem}
.mrz{grid-column:1/-1;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.18em;color:var(--on-dark-3);word-break:break-all;line-height:1.6;border-top:1px solid var(--dark-line);padding-top:1rem}
.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1rem}
.stamp{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:1.4rem 1rem 1.2rem;display:grid;justify-items:center;gap:.8rem;text-align:center;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s}
.stamp:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.stamp.off{background:transparent;border-style:dashed}
.stamp h4{font-size:1rem;letter-spacing:-.015em;line-height:1.15}
.stamp small{font-size:.74rem;color:var(--muted);font-family:var(--f-mono);letter-spacing:.03em}
.seal{display:block;transform:rotate(var(--rot,0deg));max-width:100%;height:auto}
.seal .r1{fill:none;stroke:var(--navy);stroke-width:2}
.seal .r2{fill:none;stroke:var(--navy);stroke-width:.8;stroke-dasharray:2 2.5}
.seal .r3{fill:var(--gold-soft);stroke:var(--navy);stroke-width:1.2}
.seal .tx{font-family:var(--f-mono);font-size:7.4px;letter-spacing:1.6px;fill:var(--navy);font-weight:500}
.seal .gl{fill:none;stroke:var(--navy);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.seal .nm{font-family:var(--f-mono);font-size:6.5px;fill:var(--navy);letter-spacing:1px;text-anchor:middle}
.seal.off .r1,.seal.off .r2,.seal.off .r3{stroke:var(--line-2)}
.seal.off .r3{fill:transparent}
.seal.off .tx,.seal.off .nm{fill:var(--muted)}
.seal.off .gl{stroke:var(--line-2)}
.seal.dk .r1,.seal.dk .r2,.seal.dk .r3{stroke:var(--gold)}
.seal.dk .r3{fill:rgba(245,196,0,.12)}
.seal.dk .tx,.seal.dk .nm{fill:var(--gold)}
.seal.dk .gl{stroke:var(--gold)}
.moments-tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.mt{position:relative;padding:0 0 1.8rem 1.8rem}
.mt::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--navy);border:2px solid var(--paper)}
.mt small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.mt p{font-family:var(--f-display);font-size:1.25rem;letter-spacing:-.02em;line-height:1.2;margin-top:.25rem}

/* ---------- FUTURO ---------- */
.fut-hero{background:var(--white);border-bottom:1px solid var(--line)}
.fut-hero .wrap{padding-block:clamp(3rem,7vw,6rem);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:3rem;align-items:end}
.fut-hero h1{font-size:clamp(2.6rem,6.6vw,5.6rem);line-height:.93;letter-spacing:-.05em;font-weight:700}
.fut-hero h1 span{color:var(--line-2);display:block}
.horizon{border-radius:var(--r-l);padding:1.6rem;background:var(--navy-3);color:#fff;display:grid;gap:1rem}
.hz-line{position:relative;height:56px}
.hz-line .base{position:absolute;left:0;right:0;top:27px;height:2px;background:rgba(255,255,255,.18)}
.hz-line .done{position:absolute;left:0;top:27px;height:2px;background:var(--gold)}
.hz-line .pt{position:absolute;top:21px;width:14px;height:14px;border-radius:50%;margin-left:-7px}
.hz-line .pt small{position:absolute;top:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-mono);font-size:.62rem;color:var(--on-dark-2)}
.paths{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.path{border-radius:var(--r-m);padding:1.5rem;display:flex;flex-direction:column;gap:.8rem;min-height:280px;background:var(--white);border:1px solid var(--line);transition:transform .35s var(--ease),box-shadow .35s}
.path:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.path .k{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.path h3{font-size:1.6rem;letter-spacing:-.035em;line-height:1}
.path p{font-size:.92rem;color:var(--ink-2);flex:1}
.path.hl{background:var(--navy);color:#fff;border-color:var(--navy)}
.path.hl p,.path.hl .k{color:var(--on-dark-2)}
.path .stat{font-family:var(--f-display);font-size:2.4rem;font-weight:700;letter-spacing:-.05em;line-height:1}
.path.hl .stat{color:var(--gold)}
.opp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center;padding:1.3rem 0;border-top:1px solid var(--line)}
.opp h4{font-size:1.2rem;letter-spacing:-.02em}
.kit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.kit button{text-align:left;padding:1.3rem;border-radius:var(--r-m);background:var(--sky-2);display:grid;gap:.6rem;transition:background .25s}
.kit button:hover{background:var(--sky)}
.kit .ic{width:26px;height:26px;color:var(--navy)}
.kit h4{font-size:1.1rem;letter-spacing:-.02em}
.kit small{color:var(--muted);font-size:.82rem}
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.scale5 button{height:60px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-family:var(--f-display);font-size:1.4rem;font-weight:650;border:1px solid transparent;transition:all .2s}
.scale5 button:hover{border-color:rgba(255,255,255,.4)}
.scale5 button.on{background:var(--gold);color:var(--navy-3)}

/* ---------- AJUDA ---------- */
.help-hero{background:var(--navy);color:#fff}
.help-hero .wrap{padding-block:clamp(2.5rem,6vw,5rem)}
.help-hero h1{font-size:clamp(2.4rem,5.6vw,4.6rem);line-height:.95;letter-spacing:-.045em;font-weight:700;max-width:14ch}
.hsearch{margin-top:2rem;position:relative;max-width:720px}
.hsearch input{width:100%;height:64px;border-radius:999px;border:0;padding:0 1.5rem 0 3.4rem;font-size:1.05rem;background:var(--white);color:var(--ink)}
.hsearch .ic{position:absolute;left:1.3rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem}
.topic{padding:1.2rem;border-radius:var(--r-m);background:var(--white);border:1px solid var(--line);text-align:left;display:grid;gap:.5rem;transition:border-color .2s,transform .3s var(--ease)}
.topic:hover{border-color:var(--navy);transform:translateY(-2px)}
.topic.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.topic .ic{color:var(--navy)}
.topic b{font-size:.98rem}
.topic small{color:var(--muted);font-size:.8rem}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:1.15rem 0;display:flex;justify-content:space-between;gap:1rem;font-weight:600;font-size:1.02rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .3s var(--ease);color:var(--muted)}
.faq details[open] summary .ic{transform:rotate(90deg)}
.faq details p{padding:0 0 1.2rem;color:var(--ink-2);max-width:68ch}
.chat{border-radius:var(--r-l);background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;height:520px;overflow:hidden;box-shadow:var(--sh-1)}
.chat-h{padding:1rem 1.2rem;border-bottom:1px solid var(--line);display:flex;gap:.8rem;align-items:center}
.day-av{width:40px;height:40px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:750;font-size:.95rem;letter-spacing:-.02em}
.chat-b{flex:1;overflow-y:auto;padding:1.2rem;display:flex;flex-direction:column;gap:.7rem;background:var(--paper)}
.msg{max-width:84%;padding:.75rem 1rem;border-radius:18px;font-size:.93rem;line-height:1.45;animation:rise .4s var(--ease) both}
.msg.bot{background:var(--white);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{background:var(--navy);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.chat-q{display:flex;gap:.4rem;flex-wrap:wrap;padding:.7rem 1.2rem 0}
.chat-q button{font-size:.8rem;padding:.4rem .75rem;border-radius:999px;background:var(--sky-2);color:var(--navy);font-weight:600}
.chat-f{display:flex;gap:.5rem;padding:.8rem 1.2rem 1.1rem}
.chat-f input{flex:1;min-width:0;height:46px;border-radius:999px;border:1px solid var(--line-2);padding:0 1.1rem;background:var(--paper)}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.form{display:grid;gap:1rem}
.form label{display:grid;gap:.4rem;font-weight:600;font-size:.9rem}
select,.form input{height:48px;border-radius:12px;border:1px solid var(--line-2);padding:0 .9rem;background:var(--paper)}
.tog{display:flex;align-items:center;gap:.7rem;font-weight:500;font-size:.9rem;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--navy)}

/* ---------- GESTOR ---------- */
.g-hero{background:var(--sky-2);border-bottom:1px solid var(--line)}
.g-hero .wrap{padding-block:clamp(2.5rem,6vw,5rem);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(2rem,4vw,4rem);align-items:center}
.g-hero h1{font-size:clamp(2.4rem,5.6vw,4.6rem);line-height:.95;letter-spacing:-.045em;font-weight:700}
.g-hero h1 em{font-style:normal;color:var(--blue);display:block}
.appr{background:var(--white);border-radius:var(--r-l);padding:1.6rem;box-shadow:var(--sh-2);display:grid;gap:1.2rem}
.mini-track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.mini-track span{height:6px;border-radius:9px;background:var(--mist)}
.mini-track span.d{background:var(--navy)}
.mini-track span.c{background:linear-gradient(90deg,var(--navy) var(--p),var(--mist) var(--p))}
.mom{display:grid;grid-template-columns:140px 24px minmax(0,1fr) auto;gap:1rem;align-items:start;padding:1.2rem 0;border-top:1px solid var(--line)}
.mom .w{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);padding-top:.2rem;letter-spacing:.04em}
.mom .dm{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--line-2);margin-top:.35rem}
.mom.done .dm{background:var(--navy);border-color:var(--navy)}
.mom.next .dm{background:var(--gold);border-color:var(--gold)}
.mom h4{font-size:1.15rem;letter-spacing:-.02em;font-family:var(--f-body);font-weight:650}
.mom p{color:var(--ink-2);font-size:.92rem;margin-top:.2rem}
.roteiro{background:var(--navy);color:#fff;border-radius:var(--r-l);padding:clamp(1.5rem,3vw,2.2rem);display:grid;gap:1rem}
.roteiro ol{margin:0;padding:0;list-style:none;display:grid;gap:.9rem;counter-reset:r}
.roteiro li{display:grid;grid-template-columns:36px 1fr;gap:.6rem;font-family:var(--f-display);font-size:1.15rem;line-height:1.25;letter-spacing:-.015em}
.roteiro li::before{counter-increment:r;content:counter(r);font-family:var(--f-mono);font-size:.78rem;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;margin-top:1px}
.guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.gch{padding:1.4rem;border-radius:var(--r-m);background:var(--white);border:1px solid var(--line);display:grid;gap:.6rem;align-content:start;cursor:pointer;text-align:left;transition:border-color .2s}
.gch:hover{border-color:var(--navy)}
.gch .k{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.gch h4{font-size:1.2rem;letter-spacing:-.02em}
.gch p{font-size:.9rem;color:var(--ink-2);display:none}
.gch.open p{display:block}
.gch.open{border-color:var(--navy);background:var(--sky-2)}
.signal{display:flex;gap:.8rem;align-items:flex-start;padding:1rem 1.2rem;border-radius:var(--r-m);background:var(--warn-soft)}
.signal .ic{color:var(--warn);margin-top:2px}

/* ---------- RH ---------- */
.rh{background:var(--paper)}
.rh-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;padding-block:2.5rem 1.5rem}
.rh-head h1{font-size:clamp(2rem,4.4vw,3.4rem);letter-spacing:-.045em;line-height:.95;font-weight:700}
.filters{display:flex;gap:.5rem;flex-wrap:wrap}
.filters select{height:40px;font-size:.86rem;border-radius:999px;background:var(--white);padding:0 .9rem}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.kpi{background:var(--white);padding:1.2rem 1.2rem 1.1rem;display:grid;gap:.3rem;align-content:start}
.kpi b{font-family:var(--f-display);font-size:2.3rem;line-height:1;letter-spacing:-.05em;font-weight:700;font-variant-numeric:tabular-nums}
.kpi small{font-size:.8rem;color:var(--muted);line-height:1.3}
.kpi .dl{font-size:.74rem;font-weight:600;color:var(--ok)}
.kpi.star{background:var(--navy);color:#fff}
.kpi.star small{color:var(--on-dark-2)}
.kpi.star b{color:var(--gold)}
.kpi.star .dl{color:var(--gold-2)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:1.4rem}
.panel h3{font-size:1.15rem;letter-spacing:-.02em;font-family:var(--f-body);font-weight:700}
.panel .sub{font-size:.84rem;color:var(--muted);margin-top:.2rem}
.rh-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1rem;margin-top:1rem}
.chart-wrap{overflow-x:auto;margin-top:1rem}
.chart-wrap svg{display:block;min-width:620px;width:100%;height:auto}
.chart-wrap text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.stagebar{display:flex;height:44px;border-radius:12px;overflow:hidden;margin-top:1.2rem;gap:2px}
.stagebar div{display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#fff;transform-origin:left;animation:grow 1s var(--ease) both;min-width:0}
.sb-leg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.5rem;margin-top:.8rem}
.sb-leg div{font-size:.78rem;color:var(--muted);line-height:1.25}
.sb-leg b{display:block;color:var(--ink);font-size:.86rem}
.hbars{display:grid;gap:.6rem;margin-top:1rem}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:.7rem;align-items:center;font-size:.84rem}
.hb .t{height:10px;border-radius:9px;background:var(--mist);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--navy);border-radius:9px;animation:grow 1.1s var(--ease) both}
.hb b{font-variant-numeric:tabular-nums;text-align:right}
.alerts{display:grid;gap:.6rem;margin-top:1rem}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:.9rem;padding:.9rem 1rem .9rem 0;border-radius:12px;background:var(--paper)}
.alert i{border-radius:9px;background:var(--warn)}
.alert.bad i{background:var(--bad)}
.alert.info i{background:var(--blue)}
.alert b{font-size:.9rem;display:block;line-height:1.3}
.alert small{color:var(--muted);font-size:.8rem}
.ind{display:grid;grid-template-columns:minmax(0,1fr) 70px 80px;gap:.8rem;align-items:center;padding:.7rem 0;border-top:1px solid var(--line);font-size:.88rem}
.ind b{font-family:var(--f-mono);text-align:right;font-weight:500}
.spark{height:24px;width:80px}
.spark path{fill:none;stroke:var(--navy);stroke-width:1.6}
.spark .ar{fill:var(--sky);stroke:none}
.tbl-wrap{overflow-x:auto;margin-top:1rem}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:860px}
th{text-align:left;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:.6rem .8rem;border-bottom:1px solid var(--line)}
td{padding:.75rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--sky-2)}
.eng{display:inline-flex;gap:2px}
.eng i{width:6px;height:14px;border-radius:2px;background:var(--mist)}
.eng i.f{background:var(--navy)}
.pill-st{display:inline-flex;align-items:center;gap:.35rem;font-weight:600;font-size:.8rem}
.pill-st i{width:8px;height:8px;border-radius:50%}

/* ---------- modal + toast + sheet ---------- */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(0,24,45,.62);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--white);border-radius:var(--r-l);max-width:520px;width:100%;padding:clamp(1.6rem,4vw,2.6rem);text-align:center;display:grid;gap:1rem;justify-items:center;animation:rise .5s var(--ease) both;position:relative;max-height:calc(100vh - 32px);overflow:auto}
.modal.wide-m{max-width:min(1100px,100%);padding:0;overflow:hidden;background:var(--navy-3)}
.modal h3{font-size:clamp(1.6rem,3.4vw,2.2rem);letter-spacing:-.04em;line-height:1}
.modal p{color:var(--ink-2);max-width:40ch}
.mclose{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--mist);z-index:3}
@keyframes stampin{0%{transform:scale(2.2) rotate(-30deg);opacity:0}55%{transform:scale(.92) rotate(-8deg);opacity:1}75%{transform:scale(1.04) rotate(-11deg)}100%{transform:scale(1) rotate(-10deg)}}
.stampin{animation:stampin .9s var(--ease) both .15s}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(calc(100% + 4rem));opacity:0;visibility:hidden;z-index:90;background:var(--navy-3);color:#fff;padding:.85rem 1.2rem;border-radius:999px;display:flex;gap:.6rem;align-items:center;font-weight:600;font-size:.9rem;box-shadow:var(--sh-2);transition:transform .45s var(--ease),opacity .3s,visibility .3s;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.toast .ic{color:var(--gold)}
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,24,45,.5);animation:fade .25s both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--white);border-radius:24px 24px 0 0;padding:1rem 16px calc(1.5rem + env(safe-area-inset-bottom,0px));display:grid;gap:.2rem;animation:up .35s var(--ease) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line-2);margin:0 auto .8rem}
.sheet button{display:flex;align-items:center;gap:.9rem;padding:.9rem .6rem;border-radius:12px;font-weight:600;text-align:left}
.sheet button:hover{background:var(--mist)}
.sheet .ic{color:var(--navy)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .nav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:.4rem 4px calc(.4rem + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:grid;justify-items:center;gap:.2rem;font-size:.68rem;font-weight:600;color:var(--muted);padding:.35rem 0}
  .tabbar button.on{color:var(--navy)}
  .tabbar button.on .ic{stroke-width:2.2}
  main#view{padding-bottom:7rem}
  .top .wrap{justify-content:space-between}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stamps{grid-template-columns:repeat(4,minmax(0,1fr))}
  .moments{grid-template-columns:repeat(3,minmax(0,1fr))}
  .moment{border-bottom:1px solid var(--line)}
  .paths,.kit,.topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .done-bar{bottom:6rem}
}
@media (max-width:1100px){.video-slot{position:relative;right:auto;bottom:auto;width:min(100%,420px);margin-top:2.5rem}}
@media (max-width:900px){
  .home-hero,.now,.split,.c-grid,.fut-hero .wrap,.g-hero .wrap,.rh-grid,.pass{grid-template-columns:minmax(0,1fr)}
  .pass-cover{border-right:0;border-bottom:1px dashed rgba(255,255,255,.2)}
  .g3,.guide{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .jrow{grid-template-columns:80px minmax(0,1fr)}
  .jside{grid-column:2}
  .jcp{padding-left:80px}
  .cps{grid-template-columns:minmax(0,1fr);gap:.8rem}
  .cps::before{left:15px;right:auto;top:0;bottom:0;width:2px;height:auto}
  .cpn{grid-template-columns:32px minmax(0,1fr);column-gap:1rem}
  .cpn > *:not(.dm){grid-column:2}
  .cpn .dm{grid-row:1 / span 4}
  .cpn h4{margin-top:0}
  .comp{grid-template-columns:minmax(0,1fr)}
  .trend{text-align:left}
  .stage-hero .wrap{grid-template-columns:minmax(0,1fr)}
  
  .hero-body{justify-content:flex-end}
  .pillars{grid-template-columns:minmax(0,1fr)}
  .sb-leg{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:720px){

  .seg-label{display:none}
  .brand-sep,.brand-prog{display:none}
  .track-bar{display:none}
  .track-labels{grid-template-columns:minmax(0,1fr);gap:0;margin-top:0}
  .tl{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:.9rem;padding:.8rem .5rem;border-radius:0;position:relative}
  .tl::before{content:"";grid-row:1 / span 4;width:12px;height:12px;border-radius:50%;background:var(--mist);margin:4px 0 0 8px;position:relative;z-index:1}
  .tl::after{content:"";position:absolute;left:21px;top:1.4rem;bottom:-1rem;width:2px;background:var(--mist)}

  .tl.done::before{background:var(--navy)}
  .tl.done::after{background:var(--navy)}
  .tl.cur::before{background:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
  .tl.cur{background:var(--sky-2);border-radius:12px}
  .tl > *{grid-column:2}
  .track-top{margin-bottom:1rem}
  .moments{grid-template-columns:minmax(0,1fr)}
  .moment h3{margin-top:.6rem}
  .g2,.g3,.g4,.guide,.dual,.paths,.kit{grid-template-columns:minmax(0,1fr)}
  .topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stamps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pass-data{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:.25rem}
  .day{padding:.6rem .1rem}
  .day b{font-size:1.2rem}
  .ev{display:flex;flex-direction:column;align-items:stretch;gap:.7rem;border-left:4px solid var(--blue)}
  .ev.ind{border-left-color:var(--gold)}
  .ev.evcp{border-left-color:var(--navy)}
  .ev .bar{display:none}
  .ev .tm{font-size:1.2rem}
  .item{grid-template-columns:36px minmax(0,1fr);padding:.9rem}
  .it-go{grid-column:2}
  .wk-row{grid-template-columns:60px minmax(0,1fr)}
  .wk-row > :last-child{grid-column:2}
  .mom{grid-template-columns:20px minmax(0,1fr)}
  .mom .w{grid-column:2;grid-row:1}
  .mom .dm{grid-row:1 / span 3}
  .mom > div,.mom > button{grid-column:2}
  .opp{grid-template-columns:minmax(0,1fr)}
  .countdown{position:static;text-align:left}
  .next-card{min-height:0}
  .live-row{grid-template-columns:minmax(0,1fr)}
  .live-row .d{width:auto}
  .player .ttl{right:1.2rem;bottom:3.5rem}
  .player .ttl h1{font-size:1.4rem}
  .player .ttl .chip{display:none}
  .player .bigplay{width:60px;height:60px;top:38%}
  .done-bar{border-radius:var(--r-m)}
  .hb{grid-template-columns:96px minmax(0,1fr) 36px}
  .ind{grid-template-columns:minmax(0,1fr) 56px}
  .ind .spark{display:none}
  .pd-feature .who{display:none}
  .hero-foot{flex-direction:column;align-items:flex-start;gap:.8rem}
  .marquee{width:100%}
}

const me=()=>PERSONAS[S.persona];
const pk=k=>S.persona+':'+k;
function dayN(p=me()){return diff(p.start,TODAY)+1}
function monthN(p=me()){return Math.floor((dayN(p)-1)/30.44)+1}
function stageOfMonth(m){return STAGES.findIndex(s=>m>=s.m[0]&&m<=s.m[1])}
function curStage(p=me()){const i=stageOfMonth(monthN(p));return i<0?5:i}
function isDone(s,i){const k=pk(s+'-'+i);if(k in S.over)return S.over[k];const cs=curStage();if(s<cs)return true;if(s===cs)return i<me().partial;return false}
function stageCount(s){const it=STAGES[s].items;let d=0;it.forEach((_,i)=>{if(isDone(s,i))d++});return{d,t:it.length}}
function hasSeal(id){return !!(me().seals[id]||S.newSeals[pk(id)])}
function sealDate(id){return me().seals[id]||S.newSeals[pk(id)]}
function sealCount(){return SEALS.filter(s=>hasSeal(s.id)).length}
function watched(id){const k=pk(id);return k in S.watched?S.watched[k]:(me().watched[id]||0)}
function epsDone(){return Object.keys(EPS).filter(id=>watched(id)>=100).length}
function cpDate(c,p=me()){return workday(addD(p.start,c.day-1))}
function nextCp(p=me()){return CHECKPOINTS.find(c=>cpDate(c,p)>=TODAY)}
function endDate(p=me()){return addD(p.start,Math.round(CONTRACT_M*30.44)-1)}
// position along equal-width stage track
function posOfDay(day){const m=(day-1)/30.44+1;let s=stageOfMonth(Math.floor(m));if(s<0)s=5;const st=STAGES[s];const len=st.m[1]-st.m[0]+1;const f=Math.min(1,Math.max(0,(m-st.m[0])/len));return (s+f)/6*100}

/* hero canvas: trajetórias que partem de pontos diferentes e convergem */
let cvRAF;
function heroCanvas(c){
  cancelAnimationFrame(cvRAF);
  if(!c)return;
  const ctx=c.getContext('2d');let w,h,dpr;
  const cities=['São Paulo','Recife','Curitiba','Belo Horizonte','Salvador','Porto Alegre','Brasília','Rio de Janeiro','Campinas','Fortaleza','Manaus','Goiânia'];
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);w=c.clientWidth;h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();window.addEventListener('resize',size);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tr=[];let ci=0;
  function spawn(t0){
    const ox=Math.random()*w*.55, oy=h*(.25+Math.random()*.7);
    tr.push({ox,oy,cx:ox+(w*.3)*Math.random()+w*.1,cy:oy-(h*.3)*(Math.random()-.2),t:t0,speed:.0028+Math.random()*.0025,gold:Math.random()<.22,label:cities[ci++%cities.length],life:1});
  }
  for(let i=0;i<10;i++)spawn(reduce?1:Math.random());
  let last=0;
  function bez(a,b,c2,t){return (1-t)*(1-t)*a+2*(1-t)*t*b+t*t*c2}
  function frame(ts){
    const T={x:w*.9,y:h*.34};
    ctx.clearRect(0,0,w,h);
    const g=ctx.createRadialGradient(T.x,T.y,0,T.x,T.y,Math.max(w,h)*.5);
    g.addColorStop(0,'rgba(245,196,0,.20)');g.addColorStop(.35,'rgba(42,106,166,.12)');g.addColorStop(1,'rgba(0,24,45,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    if(!reduce&&ts-last>900&&tr.length<26){spawn(0);last=ts}
    tr.forEach(p=>{
      if(!reduce){if(p.t<1)p.t=Math.min(1,p.t+p.speed);else p.life-=.004}
      const n=Math.max(2,Math.floor(p.t*80));
      ctx.beginPath();
      for(let i=0;i<=n;i++){const tt=i/80;const x=bez(p.ox,p.cx,T.x,tt),y=bez(p.oy,p.cy,T.y,tt);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      ctx.strokeStyle=p.gold?`rgba(245,196,0,${.55*p.life})`:`rgba(255,255,255,${.22*p.life})`;
      ctx.lineWidth=p.gold?1.3:.8;ctx.stroke();
      ctx.beginPath();ctx.arc(p.ox,p.oy,2.4,0,7);ctx.fillStyle=p.gold?`rgba(245,196,0,${.9*p.life})`:`rgba(255,255,255,${.6*p.life})`;ctx.fill();
      ctx.font='500 10px "JetBrains Mono", monospace';ctx.fillStyle=`rgba(255,255,255,${.32*p.life})`;ctx.fillText(p.label.toUpperCase(),p.ox+8,p.oy+3);
      if(p.t<1){const x=bez(p.ox,p.cx,T.x,p.t),y=bez(p.oy,p.cy,T.y,p.t);ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fillStyle=p.gold?'#F5C400':'#fff';ctx.fill()}
    });
    tr=tr.filter(p=>p.life>0);
    ctx.beginPath();ctx.arc(T.x,T.y,5,0,7);ctx.fillStyle='#F5C400';ctx.fill();
    if(!reduce&&route==='landing')cvRAF=requestAnimationFrame(frame);
  }
  cvRAF=requestAnimationFrame(frame);
}

      <button class="chk" data-chk="${i}-${j}" aria-label="${d?'Desmarcar':'Marcar como concluído'}" ${locked?'disabled':''}>${locked?ic('lock'):ic('check')}</button>
      <div style="min-width:0"><div class="it-t">${it.t}</div><div class="it-s"><span>${ic(it.cp?'target':it.type==='Vídeo'?'play':it.type==='Live'?'mic':'book')}${it.type}</span><span>${ic('clock')}${it.dur}</span><span>${ic(/Presencial/.test(it.mode)?'pin':'monitor')}${it.mode}</span>${it.seal?`<span style="color:var(--gold-ink)">${ic('stamp')}Vale carimbo</span>`:''}</div></div>
      ${it.ep?`<button class="it-go" data-go="conteudo" data-p="${it.ep}">Assistir ${ic('right')}</button>`:it.cp?`<button class="it-go" data-go="desenvolvimento">Ver checkpoint ${ic('right')}</button>`:!locked&&j===firstOpen?`<span class="chip gold">Próximo</span>`:'<span></span>'}
    </div>`}).join('')}</div>
    <div class="stage-nav">
      ${i>0?`<button data-go="etapa" data-p="${i-1}"><span class="eyebrow">← Etapa anterior</span><b>${STAGES[i-1].title}</b></button>`:'<span></span>'}
      ${i<5?`<button data-go="etapa" data-p="${i+1}"><span class="eyebrow">Próxima etapa →</span><b>${STAGES[i+1].title}</b></button>`:'<span></span>'}
    </div>
  </div>`;
  requestAnimationFrame(()=>setTimeout(()=>{const rc=$('#ringC');if(rc)rc.style.strokeDashoffset=C*(1-pct)},80));
  $('#items').addEventListener('click',e=>{
    const b=e.target.closest('[data-chk]');if(!b||b.disabled)return;
    const [si,ij]=b.dataset.chk.split('-').map(Number);const was=isDone(si,ij);
    S.over[pk(si+'-'+ij)]=!was;
    const row=b.closest('.item');row.classList.toggle('done',!was);row.classList.remove('focus');
    const cc=stageCount(si);$('#ringN').textContent=`${cc.d}/${cc.t}`;$('#ringC').style.strokeDashoffset=C*(1-cc.d/cc.t);
    if(!was){
      const it=STAGES[si].items[ij];
      if(cc.d===cc.t){toast(`Etapa ${STAGES[si].title} concluída. Olha o caminho que você já fez.`,'spark');if(si===0)unlockSeal('conheci-grupo')}
      else toast(`Boa, ${me().first}. Mais um passo na sua jornada.`);
      if(it.seal)unlockSeal(it.seal);
      if(it.ep){S.watched[pk(it.ep)]=100;if(epsDone()>=5)unlockSeal('por-dentro')}
    }
  });
}

  </div>
  <div class="rh-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)" id="rhG2">
    <div class="panel rv"><h3>Indicadores do programa</h3><p class="sub">Últimos 6 meses</p><div style="margin-top:.8rem">${inds.map(x=>`<div class="ind"><span>${x[0]}</span>${sparkP(x[2])}<b>${x[1]}</b></div>`).join('')}</div></div>
    <div class="panel rv" style="--i:1"><div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap"><div><h3>Aprendizes</h3><p class="sub">${rows.length} de ${ROSTER.length} na amostra · filtros aplicados</p></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Aprendiz</th><th>Empresa</th><th>Local</th><th>Entrada</th><th>Etapa</th><th>Próximo checkpoint</th><th>Engajamento</th></tr></thead><tbody>
      ${rows.map(a=>`<tr><td><b>${a.n}</b><div class="muted" style="font-size:.76rem">${a.area}</div></td><td>${a.emp}</td><td>${a.cid} · ${a.uf}</td><td class="mono">${fmtS(a.start)} ${String(a.start.getFullYear()).slice(2)}</td><td><span class="pill-st"><i style="background:${sCol[a.s]};${a.s===0?'':''}"></i>${STAGES[a.s].title} · m${a.m}</span></td><td>${a.nx?`${a.nx.label} · ${fmtS(a.nxd)}${diff(TODAY,a.nxd)<=7?' <span class="chip warn" style="height:22px">em '+diff(TODAY,a.nxd)+'d</span>':''}`:'<span class="muted">—</span>'}</td><td><span class="eng">${[1,2,3,4,5].map(n=>`<i class="${n<=a.eng?'f':''}"></i>`).join('')}</span>${a.eng<=2?' <span class="chip bad" style="height:22px">atenção</span>':''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted" style="padding:1.5rem .8rem">Nenhum aprendiz com esses filtros na amostra.</td></tr>'}
      </tbody></table></div></div>
  </div>
  </div></div>`;
  if(innerWidth<900){$('#rhG3').style.gridTemplateColumns='minmax(0,1fr)';$('#rhG2').style.gridTemplateColumns='minmax(0,1fr)'}
  ['fEmp','fUf','fSt'].forEach((id,k)=>$('#'+id).onchange=e=>{S.rh[['emp','uf','st'][k]]=e.target.value;renderRH()});
}

/* ============ RENDER / ROUTER ============ */
function render(){
  clearInterval(playT);
  view.className=route==='por-dentro'?'dark-page':'';
  document.body.style.background=route==='por-dentro'?'var(--navy-3)':'';
  ({home:renderHome,jornada:renderJornada,etapa:renderEtapa,'por-dentro':renderPorDentro,conteudo:renderConteudo,desenvolvimento:renderDesenv,agenda:renderAgenda,passaporte:renderPassaporte,futuro:renderFuturo,ajuda:renderAjuda,gestor:renderGestor,rh:renderRH}[route]||renderHome)();
  observe();
}
let io;
function observe(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target;el.classList.add('post');requestAnimationFrame(()=>el.classList.remove('pre'));io.unobserve(el)}}),{rootMargin:'0px 0px -6% 0px'});
  const vh=innerHeight;
  document.querySelectorAll('.rv').forEach(el=>{const r=el.getBoundingClientRect();if(r.top>vh*1.02){el.classList.add('pre');io.observe(el)}});
  setTimeout(()=>document.querySelectorAll('.rv.pre').forEach(el=>{el.classList.add('post');el.classList.remove('pre')}),2500);
}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-close]');
  if(c&&(c===e.target||c.tagName==='BUTTON'||e.target.closest('.mclose')||c.classList.contains('sheet-bg'))){if(c.classList.contains('modal-bg')&&e.target!==c){}else closeModal()}
  const m=e.target.closest('[data-manifesto]');
  if(m){modal(`<video id="manVid" src="manifesto.mp4" poster="manifesto-poster.jpg" controls autoplay playsinline style="display:block;width:100%;aspect-ratio:16/9;background:#000"></video>`,'wide-m');const v=$('#manVid');if(v){const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{v.muted=true;v.play().catch(()=>{})})}return}
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();const p=g.dataset.p;go(g.dataset.go,p===undefined||p===''?null:p);return}
  const r=e.target.closest('[data-role]');
  if(r){S.role=r.dataset.role;go(S.role==='aprendiz'?'home':S.role);return}
  const ps=e.target.closest('[data-persona]');
  if(ps){S.persona=ps.dataset.persona;S.chat=null;toast(`Agora você está vendo a jornada de ${me().name}.`,'users');go(route==='landing'?'home':route,param);return}
  if(e.target.closest('#bell')){toast(me().id==='livia'?'Seu checkpoint de 90 dias é na terça, 13 out.':'Você tem 2 novidades na agenda.','bell')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// initial route from bare hash
(function init(){
  const h=(location.hash||'').slice(1);
  const routes=['home','jornada','por-dentro','agenda','desenvolvimento','passaporte','futuro','ajuda','gestor','rh'];
  if(routes.includes(h))return go(h,null,false);
  const m=h.match(/^(etapa|conteudo)-(.+)$/);if(m)return go(m[1],m[2],false);
  go('landing',null,false);
})();
})();
</script>
